name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar Release no GitHub com o APK?'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          yes | ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;35.0.0" "platforms;android-35"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore from KEY
        run: |
          mkdir -p key
          if [ -n "${{ secrets.KEY }}" ]; then
            echo "Decodificando chave a partir do secret KEY..."
            echo "${{ secrets.KEY }}" | base64 -d > key/release.jks
          else
            echo "Secret KEY não configurado. Gradle usará assinatura de fallback."
          fi

      - name: Build Release APK with Gradle
        env:
          KEY: ${{ secrets.KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Locate & Verify Release APK
        id: locate_apk
        run: |
          echo "Buscando APKs gerados:"
          find app/build/outputs/apk/ -name "*.apk" -type f
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            # Fallback search any apk
            APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" -type f | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            APK_NAME=$(basename "$APK_PATH")
            echo "APK Encontrado: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
            
            # Checksum
            SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
            echo "SHA-256: $SHA256"
            echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          else
            echo "Erro: Nenhum arquivo APK foi encontrado após o build!"
            exit 1
          fi

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate_apk.outputs.apk_name }}
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate_apk.outputs.apk_path }}
          name: Fynex ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## ⚡ Fynex — Release Oficial

            **Versão**: `${{ github.ref_name }}`
            **Arquivo**: `${{ steps.locate_apk.outputs.apk_name }}`
            **SHA-256 Checksum**:
            ```
            ${{ steps.locate_apk.outputs.sha256 }}
            ```

            ### 🚀 Destaques:
            - **100% Livre & Open-Source (Sem Assinatura)**
            - Interface Moderna Material 3 (Fylo Style)
            - Painel Duplo com sincronização rápida e cópia/movimento (MT Manager Style)
            - Manipulação e navegação transparente de arquivos compactados (ZIP/APK/JAR/TAR)
            - APK Inspector & Decodificador nativo de `AndroidManifest.xml`
            - Assinador de APK com AOSP TestKey
            - Editor de Código com Busca Regex e Explicação com IA
            - Visualizador Hexadecimal de 3 colunas
            - Comparador Diff de Arquivos lado a lado
            - Servidor PC Web Transfer via Wi-Fi integrado
            - Cofre Seguro com Criptografia AES-256-GCM e Biometria
            - Assistente de IA para arquivos com Google Gemini Grátis e Ollama Local

            ---
            *Se você gosta do Fynex, considere apoiar o projeto com uma doação via PIX ou Cripto na tela "Apoiar"!*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
